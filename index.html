<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020c08">
<title>THE SLA NETWORK</title>
<meta name="description" content="El mapa vivo del ecosistema tech de LATAM, contado por SLA.">
<link rel="icon" href="assets/sla-logo.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-label="Mapa de estrellas: cada estrella es un invitado de SLA"></canvas>
<div class="grid" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<header class="bar">
  <a class="brand" href="https://slatv.live" target="_blank" rel="noopener" aria-label="SLA">
    <img src="assets/sla-logo.svg" alt="SLA" width="56" height="17">
  </a>
  <span class="sep" aria-hidden="true">/</span>
  <span class="crumb">network</span>
  <span class="pill"><i></i>LIVE MAP</span>
  <nav class="actions">
    <button id="sound" class="btn" aria-pressed="false"><span class="mono">♪</span> <span id="soundLabel">Sonido</span></button>
    <a class="btn ghost" href="https://github.com/giancarlobrusca/network.slatv.live" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<section class="hero">
  <p class="eyebrow mono">SLA · SIGUIENDO LOS ACONTECIMIENTOS</p>
  <h1>THE SLA<br>NETWORK</h1>
  <p class="lede">El mapa vivo del ecosistema tech de LATAM, dibujado episodio a episodio. Cada estrella es un invitado; cada línea, algo que comparten.</p>
  <dl class="stats mono" id="stats"></dl>
</section>

<aside class="legend" id="legend" aria-label="Verticales"></aside>
<p class="hint mono" id="hint">ARRASTRÁ PARA ORBITAR · TOCÁ UNA ESTRELLA</p>

<aside id="card" class="card" hidden role="dialog" aria-live="polite">
  <button id="close" class="x" aria-label="Cerrar">✕</button>
  <div id="cardBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
